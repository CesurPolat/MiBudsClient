name: General issue
description: Ask a question or share anything that does not fit the other templates.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. You can write in your preferred language.
        For bugs or feature requests, you can use the dedicated templates.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to ask or share?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: App and device (optional)
      description: Include your app version (or source commit), OS, and earbuds model if relevant.
      placeholder: e.g. v1.2.3, Windows 11, Redmi Buds 6 Play
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: Add screenshots, links, or relevant logs (F12). Remove personal information and Bluetooth addresses before posting.
