<style>
  :root { color-scheme:dark; --page:#080b0e; --paper:#0d1218; --panel:#191f24; --text:#f3f6fb; --muted:#c5ceda; --line:#455466; --accent:#8cb2f6; --tint:#192941; --sans:system-ui,"Segoe UI",sans-serif; --mono:ui-monospace,Consolas,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--text); font-family:var(--sans); line-height:1.55; }
  main { max-width:1450px; margin:auto; padding:40px clamp(16px,4vw,68px) 60px; }
  header { border-top:1px solid var(--line); padding-top:24px; margin-bottom:24px; }
  h1,h2,p,figure { margin:0; }
  h1 { font:400 clamp(2.4rem,5.5vw,4.7rem)/1.06 Georgia,serif; letter-spacing:-.045em; }
  header p { margin-top:12px; max-width:68ch; }
  p { color:var(--muted); }
  a { color:#a6c3ff; text-underline-offset:.22em; }
  a:focus-visible,.diagram:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
  code,.technical,.edge-label { font-family:var(--mono); }
  code { font-size:.88em; overflow-wrap:anywhere; }
  .diagram { overflow-x:auto; border:1px solid var(--line); border-radius:8px; }
  svg { display:block; width:100%; min-width:1280px; height:auto; }
  .surface { fill:var(--paper); }
  .box { fill:var(--panel); stroke:var(--line); }
  .focal { fill:var(--tint); stroke:var(--accent); stroke-width:1.5; }
  .arrow { fill:none; stroke:#acb9c8; stroke-width:1.6; marker-end:url(#diagnostics-arrow); }
  .remote { stroke:var(--accent); stroke-dasharray:5 4; marker-end:url(#diagnostics-remote); }
  .node-title { fill:var(--text); font-size:18px; font-weight:650; }
  .node-copy,.technical,.edge-label { fill:var(--muted); font-size:13px; }
  .decision-source { font-size:12px; }
  .notes { display:grid; grid-template-columns:1.2fr 1fr 1.05fr; gap:24px; margin-top:20px; }
  .notes > div { border-top:1px solid var(--line); padding-top:10px; }
  h2 { font-size:1rem; }
  .notes p { margin:5px 0 8px; font-size:.9rem; }
  .notes a { font-size:.85rem; }
  @media (max-width:760px) { .notes { grid-template-columns:1fr; gap:16px; } }
  @media print { main { padding:0; } .diagram { overflow:visible; } svg { min-width:0; } * { print-color-adjust:exact; -webkit-print-color-adjust:exact; } }
</style>

    <figcaption class="notes">
      <div>
        <h2>Bluetooth anlık görüntüsü</h2>
        <p>Keşif ve cihaz durumu, hata aşaması, en fazla 20 taşıma kaydı, varsa kimlik doğrulama özeti, cihaz kimliği ve katalog bilgisi.</p>
        <a href="../controllers/bluetooth/link/session.py">Bluetooth oturumu</a> · <a href="../controllers/bluetooth/link/failures.py">Bağlantı tanılaması</a>
      </div>
      <div>
        <h2>Rapor içeriği</h2>
        <p><code>make_report()</code>, Bluetooth ayrıntılarını ve en fazla sekiz istisna nedenini raporun <code>stack</code> alanına ekler. Uygulama sürümü ve kaynak dosyaları erişilebiliyorsa Bluetooth kodunun SHA-256 özeti bu aşamada eklenir. Hassas değerler maskelenir ve aynı hata adı, mesaj ve yığın özetine sahip raporlar elenir.</p>
        <a href="../utils/diagnostics/error_reports.py">Rapor oluşturma</a> · <a href="../ui/components/dialogs/error_report.py">Onay penceresi</a>
      </div>
      <div>
        <h2>Kuyruk ve yeniden deneme</h2>
        <p>Kuyruk en fazla 20 rapor tutar. Geçici hatalarda 1, 5, 30 ve 120 dakika sonra tekrar denenir. Sunucunun <code>Retry-After</code> değeri beklemeyi uzatabilir. En fazla 5 deneme yapılır ve 7 günlük kayıtlar temizlenir.</p>
        <a href="../utils/diagnostics/error_reports.py">Yerel kuyruk</a> · <a href="../utils/api/error_reporting.py">HTTP istemcisi</a>
      </div>
    </figcaption>
