<section #stage class="hero" aria-labelledby="hero-title">
  <app-sound-waves [paused]="paused()"/>
  <div class="wrap hero-inner">
    <div class="intro">
      <p class="kicker"><span></span> OPEN-SOURCE EARBUD CONTROL</p>
      <h1 id="hero-title">Your sound.<br><em>Your desktop.</em></h1>
      <p class="lede">Meet MiBudsClient. Check your Xiaomi or Redmi earbuds’ battery, tune your sound and switch listening modes on Windows and Linux.</p>
      <div class="actions">
        <a class="button primary" href="#download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg>Get MiBudsClient</a>
        <a class="text-link" href="#features">Explore features</a>
      </div>
    </div>
    <app-buds-viewer (viewRequested)="choose($event)"/>
  </div>
  <div class="wrap stage-foot">
    <span class="hardware">REDMI BUDS 6 PLAY</span>
    @if (motionEnabled()) {
      <span class="cue"><i></i> Scroll to unbox</span>
      <button type="button" (click)="paused.set(!paused())" [attr.aria-pressed]="paused()">{{ paused() ? 'Resume waves' : 'Pause waves' }}</button>
    }
  </div>
</section>
